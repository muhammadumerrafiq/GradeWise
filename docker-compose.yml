version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gradewise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradewise
      POSTGRES_PASSWORD: gradewise_dev_password
      POSTGRES_DB: gradewise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradewise -d gradewise"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
